    <noscript>
      <main>
        <h1>besayfe: menu de alergénios e app de alergias alimentares / allergen menu and food allergy app</h1>
        <p>
          O besayfe é uma aplicação de alergias alimentares para quem quer comer fora com segurança. Escolha os
          alergénios que evita, abra o mapa ou leia o código QR na mesa e veja cada menu prato a prato. Se o menu ainda
          não estiver na aplicação, fotografe-o e o besayfe lê o texto e estima os alergénios em segundos. Serve para
          alergias alimentares, intolerâncias, doença celíaca, restaurantes sem glúten, sem lactose, sem frutos secos,
          sem marisco e sem amendoim.
        </p>
        <p>
          besayfe is a food allergy app and digital allergen menu for eating out. Set the allergens you avoid, open the
          map or scan the QR code at the table and see each menu dish by dish. If a menu is not in the app yet,
          photograph it and besayfe reads it and estimates the allergens in seconds. Useful for food allergies,
          intolerances, coeliac disease, and gluten-free, dairy-free, nut-free, shellfish-free and peanut-free dining.
        </p>
        <h2>Como funciona / How it works</h2>
        <ol>
          <li>Escolha os alergénios que evita (os 14 alergénios da UE) / Pick the allergens you avoid (the 14 EU allergens).</li>
          <li>Abra o mapa ou leia o código QR na mesa / Open the map or scan the QR code at the table.</li>
          <li>Veja o que pode pedir, prato a prato / See what you can order, dish by dish.</li>
          <li>Sem menu na app? Fotografe-o para obter uma estimativa / No menu yet? Photograph it for an estimate.</li>
        </ol>
        <h2>Os 14 alergénios de declaração obrigatória / The 14 EU allergens</h2>
        <p>Regulamento (UE) n.º 1169/2011 e Decreto-Lei n.º 26/2016 / EU Regulation 1169/2011.</p>
        <ul>
          <li>Glúten / Gluten: celíacos, doença celíaca, sem glúten.</li>
          <li>Leite e lactose / Milk and lactose: intolerância à lactose, alergia à proteína do leite, sem lactose.</li>
          <li>Frutos de casca rija (frutos secos) / Tree nuts: amêndoas, avelãs, nozes, caju, pistáchio.</li>
          <li>Amendoins / Peanuts: alergia a amendoim.</li>
          <li>Ovos / Eggs: alergia ao ovo.</li>
          <li>Peixe / Fish: alergia a peixe.</li>
          <li>Crustáceos e moluscos / Shellfish: marisco, camarão, ameijoa, polvo.</li>
          <li>Soja / Soy: alergia à soja.</li>
          <li>Sésamo / Sesame: sementes de sésamo.</li>
          <li>Aipo / Celery: alergia ao aipo.</li>
          <li>Mostarda / Mustard: alergia à mostarda.</li>
          <li>Sulfitos / Sulphites: dióxido de enxofre, vinho.</li>
          <li>Tremoço / Lupin: alergia ao tremoço.</li>
        </ul>
        <h2>Perguntas frequentes / FAQ</h2>
        <h3>O que é o besayfe?</h3>
        <p>O besayfe é uma aplicação de alergias alimentares que mapeia restaurantes de acordo com os alergénios que evita, para ver cada menu prato a prato antes de pedir. Se o menu ainda não estiver na aplicação, fotografe-o e o besayfe estima os alergénios.</p>
        <h3>What is besayfe?</h3>
        <p>besayfe is a food allergy app that maps restaurants against the allergens you avoid, so you can see menus dish by dish before you order. If a menu is not in the app, you can photograph it and besayfe estimates the allergens.</p>
        <h3>Que alergénios cobre o besayfe?</h3>
        <p>Os 14 alergénios de declaração obrigatória na UE: glúten, crustáceos, ovos, peixe, amendoins, soja, leite (lactose), frutos de casca rija (frutos secos), aipo, mostarda, sésamo, sulfitos, tremoço e moluscos.</p>
        <h3>Which allergens does besayfe cover?</h3>
        <p>The 14 major EU allergens: gluten, crustaceans, eggs, fish, peanuts, soy, milk (lactose), tree nuts, celery, mustard, sesame, sulphites, lupin and molluscs.</p>
        <h3>Como encontrar restaurantes sem frutos secos (frutos de casca rija)?</h3>
        <p>Escolha frutos de casca rija (frutos secos) como alergénio a evitar e veja, prato a prato, o que pode pedir em cada restaurante. Confirme sempre com o restaurante, por causa da contaminação cruzada.</p>
        <h3>Como encontrar restaurantes sem glúten para celíacos?</h3>
        <p>Escolha glúten como alergénio a evitar e o menu assinala os pratos que o contêm. Se o menu não estiver na aplicação, fotografe-o para obter uma estimativa. Confirme sempre com o restaurante.</p>
        <h3>Como encontrar restaurantes sem lactose?</h3>
        <p>Escolha leite (lactose) como alergénio a evitar e veja que pratos o contêm ou podem conter. Serve para alergia à proteína do leite e para intolerância à lactose.</p>
        <h3>Há restaurantes sem marisco, sem amendoim ou sem ovo?</h3>
        <p>Pode escolher qualquer um dos 14 alergénios, incluindo crustáceos, moluscos, amendoins e ovos, e o menu assinala os pratos a evitar.</p>
        <h3>Que alergénios têm os restaurantes obrigação de indicar em Portugal?</h3>
        <p>Os 14 alergénios do Regulamento (UE) n.º 1169/2011, aplicado em Portugal pelo Decreto-Lei n.º 26/2016. O besayfe junta esta informação num menu de alergénios fácil de filtrar.</p>
        <h3>O que é um menu de alergénios ou tabela de alergénios?</h3>
        <p>É uma tabela que cruza os pratos de um menu com os 14 alergénios, indicando o que cada prato contém ou pode conter. O besayfe transforma essa tabela num menu que se filtra pelos alergénios que evita.</p>
        <h3>Como funciona a fotografia do menu?</h3>
        <p>Fotografe o menu do restaurante. O besayfe lê o texto com OCR e estima os alergénios de cada prato em segundos. É uma estimativa e não substitui confirmar com o restaurante.</p>
        <h3>Posso ler um menu com código QR?</h3>
        <p>Sim. Leia o código QR na mesa, escolha os alergénios que evita e veja prato a prato o que pode pedir.</p>
        <h3>O besayfe funciona em português e inglês?</h3>
        <p>Sim, está disponível em português e em inglês.</p>
        <h3>Can I rely on besayfe completely?</h3>
        <p>Photo-based estimates do not replace confirming with the restaurant. Always tell the staff about your allergy, because cross-contamination can happen in any kitchen.</p>
        <h3>How do I find nut-free, gluten-free or dairy-free restaurants?</h3>
        <p>Pick the allergens you avoid (tree nuts, peanuts, gluten, milk and others) and the besayfe allergen menu shows which dishes you can order.</p>
