        <h1>besayfe: app de alergénios para comer fora / allergen app for eating out</h1>
        <p>
          O besayfe é uma aplicação que mapeia restaurantes de acordo com os alergénios que evita.
          Escolha os seus alergénios, abra o mapa e veja cada menu prato a prato. Se o menu ainda não estiver na
          aplicação, fotografe-o e o besayfe lê o texto e estima os alergénios em segundos.
        </p>
        <p>
          besayfe is a food allergy app that maps restaurants against the allergens you avoid. Set your allergens,
          open the map and see each menu dish by dish. If a menu is not in the app yet, photograph it and besayfe
          reads it and estimates the allergens in seconds.
        </p>
        <h2>Como funciona / How it works</h2>
        <ol>
          <li>Escolha os alergénios que evita (os 14 alergénios da UE) / Pick the allergens you avoid (the 14 EU allergens).</li>
          <li>Abra o mapa ou leia o código QR na mesa / Open the map or scan the QR code at the table.</li>
          <li>Veja o que pode pedir, prato a prato / See what you can order, dish by dish.</li>
          <li>Sem menu na app? Fotografe-o para obter uma estimativa / No menu yet? Photograph it for an estimate.</li>
        </ol>
        <h2>Perguntas frequentes / FAQ</h2>
        <h3>O que é o besayfe? / What is besayfe?</h3>
        <p>Uma app gratuita para pessoas com alergias e intolerâncias alimentares que querem comer fora com mais segurança. / An app for people with food allergies and intolerances who want to eat out more safely.</p>
        <h3>Que alergénios cobre? / Which allergens does it cover?</h3>
        <p>Glúten, crustáceos, ovos, peixe, amendoins, soja, leite, frutos de casca rija, aipo, mostarda, sésamo, sulfitos, tremoço e moluscos. / Gluten, crustaceans, eggs, fish, peanuts, soy, milk, tree nuts, celery, mustard, sesame, sulphites, lupin and molluscs.</p>
        <h3>Posso confiar a 100%? / Can I trust it fully?</h3>
        <p>As estimativas a partir de fotografias não substituem confirmar com o restaurante. / Photo-based estimates do not replace confirming with the restaurant.</p>
