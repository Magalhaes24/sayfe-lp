<!DOCTYPE html>
<html lang="pt">
  <head>
    <!-- 01. Basic Metadata -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#73ac84" />

    <!-- 02. Title and Description -->
    <title>besayfe</title>
    <meta
      name="description"
      content="A besayfe liga restaurantes e clientes com alergias através de menus inteligentes e insights de segurança em tempo real. Descubra como comer com confiança e simplicidade."
    />

    <!-- 03. Keywords -->
    <meta
      name="keywords"
      content="besayfe.com, besayfe, restaurantes, alergias, seguranca alimentar, tecnologia alimentar, app restaurantes, experiencia jantar segura, Portugal"
    />

    <!-- 04. Author and Language -->
    <meta name="author" content="besayfe.com" />
    <meta name="language" content="pt-PT" />

    <!-- 05. Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="besayfe - Comer com mais segurança"
    />
    <meta
      property="og:description"
      content="A plataforma besayfe liga restaurantes e clientes com alergias através de refeições seguras, personalizadas e transparentes."
    />
    <meta property="og:image" content="%PUBLIC_URL%/social-preview.png" />
    <meta property="og:url" content="https://www.besayfe.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="besayfe.com" />
    <meta property="og:locale" content="pt_PT" />

    <!-- 06. Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="besayfe - Comer com mais segurança"
    />
    <meta
      name="twitter:description"
      content="Visite besayfe.com para descobrir menus inteligentes e insights de segurança em tempo real pensados para pessoas com alergias alimentares."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/social-preview.png" />
    <meta name="twitter:url" content="https://www.besayfe.com/" />

    <!-- 07. Icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo1000.png" />

    <!-- 08. Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- 09. Canonical URL -->
    <link rel="canonical" href="https://www.besayfe.com/" />

    <!-- 10. Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <noscript>besayfe - Comer com mais segurança</noscript>
    <div id="root"></div>

    <!-- 11. GitHub Pages route redirect handler -->
    <script>
      (function () {
        if (sessionStorage.redirect) {
          var redirect = sessionStorage.redirect;
          delete sessionStorage.redirect;
          if (redirect && redirect !== "/") {
            history.replaceState(null, null, redirect);
          }
        }
      })();
    </script>
  </body>
</html>
